{% extends 'base.html' %}
{% block content %}
{% load static %}

<div class="card">
  <div class="card-header">
    <h4>{% if amenity %}Update{% else %}Add{% endif %} Amenity</h4>
  </div>
  <div class="card-body">
    <div class="card-wrapper border rounded-3">
      <form method="post" enctype="multipart/form-data" class="row g-3">
        {% csrf_token %}

        <div class="col-md-6">
          <label for="{{ form.name.id_for_label }}" class="form-label required-label">Name</label>
          {{ form.name }}
        </div>

        <div class="col-md-6">
          <label for="{{ form.icon.id_for_label }}" class="form-label">Icon</label>
          {{ form.icon }}
          {% if amenity and amenity.icon %}
            <div class="mt-2">
              <img src="{{ amenity.icon.url }}" alt="{{ amenity.name }}" width="40">
            </div>
          {% endif %}
        </div>

        <div class="col-12">
          <button class="btn btn-primary" type="submit">Save</button>
          <a class="btn btn-secondary" href="{% url 'amenity-list' %}">Go Back</a>
        </div>

      </form>
    </div>
  </div>
</div>

{% endblock %}
